name: Bug report
description: Report behavior that does not work as expected.
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the Mybots version or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: entry-point
    attributes:
      label: Affected entry point
      options:
        - CLI
        - Bot
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and private conversation content.
      render: text
