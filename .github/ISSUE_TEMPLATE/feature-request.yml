name: Feature request
description: Describe a use case and the behavior needed to support it.
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: Current limitation
      description: What prevents you from accomplishing it today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe the result you would like to see.
    validations:
      required: true
