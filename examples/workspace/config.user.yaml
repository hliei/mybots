default_agent: helper
agents_path: .agents/bots
skills_path: .agents/skills
history_path: .agent/history
llm:
  provider: deepseek
  model: deepseek-flash
  api_key: ""
  api_base: https://api.deepseek.com
  temperature: 0.7
  max_tokens: 2048
  thinking: true

# Optional web tools.
# web_search:
#   provider: brave # or serpapi
#   api_key: YOUR_SEARCH_API_KEY
# fetch_content: {} # Direct HTTP HTML/Markdown/plain text; no JavaScript rendering.

# Connection configuration is validated here; connections are provided by the bot runtime.
# All directories and connection settings require restart.
logging_path: .logs
event_path: .event
channels:
  enabled: false
  telegram:
    enabled: false
    bot_token: ""
    allowed_user_ids: [] # Numeric user IDs as strings, e.g. ["123456789"].
api:
  enabled: false
  host: 127.0.0.1
  port: 8000
sources: {} # Runtime source-to-session bindings: source: {session_id: ID}.
default_delivery_source: null
