default_agent: helper
agents_path: .agents/bots
skills_path: .agents/skills
history_path: .agent/history
llm:
  provider: deepseek
  model: deepseek-flash
  api_key: ""
  api_base: https://api.deepseek.com
  temperature: 0.7
  max_tokens: 2048
  thinking: true

# Optional web tools.
# web_search:
#   provider: brave # or serpapi
#   api_key: YOUR_SEARCH_API_KEY
# fetch_content: {} # Direct HTTP HTML/Markdown/plain text; no JavaScript rendering.

# Connection configuration is validated here; the bot runtime starts Telegram
# polling only when channels.enabled and channels.telegram.enabled are both true.
# Channel enablement, the bot token, the allowlist and all directories require restart.
logging_path: .logs
event_path: .event
channels:
  enabled: false
  telegram:
    enabled: false
    bot_token: "" # Required when Telegram is enabled; keep real secrets out of Git.
    allowed_user_ids: [] # Numeric user IDs as strings, e.g. ["123456789"]; empty allows every user.
api:
  enabled: false
  host: 127.0.0.1
  port: 8000
sources: {} # Runtime source-to-session bindings: source: {session_id: ID}.
default_delivery_source: null
